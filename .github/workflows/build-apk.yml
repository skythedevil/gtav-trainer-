name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Safety net: runs the installer logic against a pretend PS5 before building.
      - name: Self-test (pretend PS5)
        run: sh tools/selftest/run.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GTA-V-PS5-Menu-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publishes a simple download link:
      # https://github.com/<you>/<repo>/releases/latest/download/app-debug.apk
      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "GTA V PS5 Menu Installer (latest build)" \
            --notes "Download app-debug.apk, install it on your phone, and follow the README." \
            --latest
