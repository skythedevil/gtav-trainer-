name: Build APK

on:
  push:
    branches: [main, feature/gta-speedometer]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Build the in-game bridge for BOTH supported GTA V profiles. The APK
      # installer only transfers these binaries; it does not execute game code.
      - name: Install Zig 0.14.1
        run: |
          curl -fsSL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Prepare native bridge build inputs
        run: |
          mkdir -p menu/profiles/ppsa04264-01.010.002
          cp menu-source/bridge.c menu-source/bridge.ld menu-source/menu.c menu-source/fidelity-cap.h menu-source/clothing-labels.h menu-source/vehicles.json menu/
          cp app/src/main/assets/menu/profile.json menu/profile.json
          cp app/src/main/assets/menu/native-addresses.json menu/native-addresses.json
          cp menu-source/profiles-source/ppsa04264-01.010.002/profile.json menu/profiles/ppsa04264-01.010.002/profile.json
          cp menu-source/profiles-source/ppsa04264-01.010.002/native-addresses.json menu/profiles/ppsa04264-01.010.002/native-addresses.json
          printf '[".", "profiles/ppsa04264-01.010.002"]\n' > menu/profiles.json

      - name: Build both native game bridges
        env:
          ZIG: zig
        run: |
          node scripts/build-gta-bridge.mjs
          cp menu/gta-bridge.bin app/src/main/assets/menu/gta-bridge.bin
          cp menu/profiles/ppsa04264-01.010.002/gta-bridge.bin app/src/main/assets/menu/profiles/ppsa04264-01.010.002/gta-bridge.bin

      # Safety net: runs the installer logic against a pretend PS5 before building.
      - name: Self-test (pretend PS5)
        run: sh tools/selftest/run.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GTA-V-PS5-Menu-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish only from main; feature branches produce artifacts for review.
      - name: Publish release with the APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "GTA V PS5 Menu Installer (latest build)" \
            --notes "Download app-debug.apk, install it on your phone, and follow the README." \
            --latest
